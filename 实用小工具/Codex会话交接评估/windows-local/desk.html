async function completed(job){if(job.state==='done'){try{job.reportText=(await api('/api/report?id='+encodeURIComponent(job.id))).text;}catch{job.reportText=null;}if(!cache.has(job.id))cache.set(job.id,new Map());cache.get(job.id).set(job.language,job);rememberScore(job);}try{tasks=(await api('/api/tasks')).tasks;}catch(e){notice(e.message,true);}}

async function queryTask(id,preserve=false,activate=true){if(pending.has(id)||stopped||(refreshBusy&&activate))return;pending.add(id);if(activate)active=id;if(!preserve)cache.delete(id);jobs.set(id,{id,language,state:'running'});list();if(active===id)show();try{const job=await api('/api/query',{id,language,preserveHistory:preserve});jobs.set(id,job);if(job.state!=='running'){pending.delete(id);await completed(job);}}catch(e){pending.delete(id);jobs.set(id,{id,language,state:'failed',error:e.message});}finally{list();if(active===id)show();}}
const pause=ms=>new Promise(resolve=>setTimeout(resolve,ms));
async function refreshAll(){if(refreshBusy||orderBusy||stopped||pending.size||!tasks.length)return;const originalActive=active,ids=tasks.map(task=>task.id);let next=0,succeeded=0,failed=0;refreshBusy=true;$('save').disabled=true;revision++;list();notice(tf('refreshProgress',0,ids.length));const worker=async()=>{while(next<ids.length&&!stopped){const id=ids[next++];await queryTask(id,true,false);while(pending.has(id)&&!stopped)await pause(100);if(stopped)break;if(jobs.get(id)?.state==='done')succeeded++;else failed++;notice(tf('refreshProgress',succeeded+failed,ids.length));}};try{await Promise.all(Array.from({length:Math.min(2,ids.length)},worker));}finally{refreshBusy=false;$('save').disabled=stopped;revision++;active=originalActive&&tasks.some(task=>task.id===originalActive)?originalActive:null;list();show();if(!stopped)notice(tf('refreshDone',succeeded,failed));}}
