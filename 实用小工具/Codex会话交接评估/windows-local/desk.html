<script>

const $=id=>document.getElementById(id),token=location.hash.slice(1);let language='zh-CN',tasks=[],active=null,editing=null,revision=0,reportRaw='',reportRun=null,metadataBusy=false,jobs=new Map(),pending=new Set(),stopped=false,switching=false,toastTimer;
const t=key=>{if(!messages[key])throw Error('Missing translation: '+key);return messages[key][language==='en-US'?1:0];};
async function api(route,body){let response;try{response=await fetch(route,{method:body===undefined?'GET':'POST',headers:{'X-SessionDesk':token,'Accept-Language':language,...(body===undefined?{}:{'Content-Type':'application/json'})},body:body===undefined?undefined:JSON.stringify(body)});}catch{throw Error(t('network'));}const result=await response.json();if(!response.ok)throw Error(result.error||t('failed'));return result;}
function notice(text,error=false){$('notice').textContent=text;$('notice').className=error?'error':'';}
function resetForm(){editing=null;$('form').reset();formText();}
function formText(){$('formTitle').textContent=t('newTask');$('save').textContent=t('save');}
function list(){const q=$('search').value.trim().toLowerCase();$('count').textContent='('+tasks.length+')';$('tasks').replaceChildren();for(const task of tasks.filter(x=>[x.project,x.name,x.id].join(' ').toLowerCase().includes(q))){const row=document.createElement('div');row.className='task'+(active===task.id?' selected':'');row.dataset.id=task.id;const heading=document.createElement('div');heading.className='task-heading';const project=document.createElement('span');project.textContent=task.project||t('noProject');const name=document.createElement('span');name.className='name';name.textContent=task.name||t('noName');heading.append(project,name);const id=document.createElement('div');id.className='id';id.textContent=task.id;const actions=document.createElement('div');actions.className='actions';const query=document.createElement('button');query.className='primary';query.dataset.query=task.id;query.textContent=t(pending.has(task.id)?'querying':'query');query.disabled=pending.has(task.id)||stopped||switching;query.onclick=()=>queryTask(task.id);const remove=document.createElement('button');remove.textContent=t('remove');remove.disabled=pending.has(task.id)||stopped;remove.onclick=async()=>{try{revision++;tasks=(await api('/api/tasks',{action:'delete',id:task.id})).tasks;jobs.delete(task.id);if(editing===task.id)resetForm();if(active===task.id){active=null;show();}list();notice(t('deleted'));}catch(e){notice(e.message,true);}};const view=document.createElement('button');view.textContent=t('view');view.disabled=!jobs.has(task.id);view.onclick=()=>{active=task.id;list();show();};actions.append(query,view,remove);row.append(heading,id,actions);$('tasks').append(row);}if(!$('tasks').children.length)$('tasks').textContent=t(tasks.length?'noMatch':'empty');for(const b of document.querySelectorAll('[data-lang]')){b.disabled=!!pending.size||stopped||switching;b.title=pending.size?t('languageBusy'):'';}}
function decorate(raw,report=false){const task=tasks.find(x=>x.id===active);if(!task)return raw;
const name=task.name||t('noName'),project=task.project||t('noProject');
const pattern=report ? /^\s*- (?:任务名称：|Task name:)[^\r\n]*/m : /^(?:任务名称：|Task name:)[^\r\n]*/m;
const text=raw.replace(pattern,()=>report?'- '+t('nameLabel')+name:t('nameLabel')+name);
return t('projectLabel')+project+'\n'+text;}
function live(){const task=tasks.find(x=>x.id===active),job=jobs.get(active);$('selected').textContent=task?(task.name||t('noName')):t('result');$('selectedId').textContent=active||'';$('nameNote').hidden=!task||(task.nameFound&&task.projectFound);$('nameNote').textContent=t('metadataWarning');if(job?.state==='done')$('output').textContent=decorate(job.output);if(!$('reportPanel').hidden&&reportRun===job?.run)$('report').textContent=decorate(reportRaw,true);}
function show(){const job=jobs.get(active);$('reportPanel').hidden=true;$('report').textContent='';reportRaw='';reportRun=null;$('reportButton').disabled=!job||job.state!=='done'||stopped;$('time').textContent=job?.finished?t('finished')+new Date(job.finished).toLocaleString(language):'';$('status').textContent=t(job?job.state:'idle');$('output').textContent=!job?t('outputHelp'):job.state==='running'?t('reading'):job.state==='done'?decorate(job.output):(job.error||t('failed'));live();}
function render(){document.documentElement.lang=language;document.title=t('title');for(const node of document.querySelectorAll('[data-i18n]'))node.textContent=t(node.dataset.i18n);for(const node of document.querySelectorAll('[data-lang]'))node.setAttribute('aria-pressed',String(node.dataset.lang===language));formText();list();show();}
async function completed(job){tasks=(await api('/api/tasks')).tasks;}
async function metadataPoll(){if(stopped)return;if(!metadataBusy&&!document.hidden){metadataBusy=true;const rev=revision;try{const r=await api('/api/tasks');if(rev===revision){tasks=r.tasks;list();live();}}catch(e){notice(e.message,true);}finally{metadataBusy=false;}}if(!stopped)setTimeout(metadataPoll,3000);}
async function queryTask(id){if(pending.has(id)||stopped)return;pending.add(id);active=id;jobs.set(id,{state:'running'});list();show();try{const job=await api('/api/query',{id,language});jobs.set(id,job);if(job.state!=='running'){pending.delete(id);await completed(job);}}catch(e){pending.delete(id);jobs.set(id,{state:'failed',error:e.message});}finally{list();if(active===id)show();}}
async function poll(){if(stopped)return;for(const id of [...pending]){const known=jobs.get(id);if(!known?.run)continue;try{const job=await api('/api/job?id='+encodeURIComponent(id));if(jobs.get(id)?.run!==known.run)continue;jobs.set(id,job);if(job.state!=='running'){await completed(job);pending.delete(id);list();if(active===id)show();}}catch(e){pending.delete(id);jobs.set(id,{state:'failed',error:e.message});list();if(active===id)show();}}if(!stopped)setTimeout(poll,350);}
$('form').onsubmit=async e=>{e.preventDefault();const id=$('id').value.trim().toLowerCase();if(!/^[a-f0-9]{8}-[a-f0-9]{4}-[a-f0-9]{4}-[a-f0-9]{4}-[a-f0-9]{12}$/.test(id)){notice(t('invalidId'),true);return;}$('save').disabled=true;revision++;try{tasks=(await api('/api/tasks',{action:'add',id})).tasks;resetForm();list();if(active)show();notice(t('saved'));}catch(e){notice(e.message,true);}finally{$('save').disabled=stopped;}};
$('newTask').onclick=resetForm;$('search').oninput=list;
for(const button of document.querySelectorAll('[data-fixture]'))button.onclick=()=>{resetForm();$('id').value='00000000-0000-0000-0000-'+button.dataset.fixture.padStart(12,'0');};
for(const button of document.querySelectorAll('[data-lang]'))button.onclick=async()=>{if(button.dataset.lang===language||pending.size)return;switching=true;list();try{await api('/api/settings',{language:button.dataset.lang});language=button.dataset.lang;jobs.clear();$('toast').hidden=true;render();notice(t('languageUpdated'));if(active)await queryTask(active);}catch(e){notice(e.message,true);}finally{switching=false;list();}};
$('reportButton').onclick=async()=>{const id=active,run=jobs.get(id)?.run;try{const r=await api('/api/report?id='+encodeURIComponent(id));if(active!==id||jobs.get(id)?.run!==run)return;reportRaw=r.text;reportRun=run;$('report').textContent=decorate(r.text,true);$('reportPanel').hidden=false;$('reportPanel').open=true;}catch(e){notice(e.message,true);}};
$('shutdown').onclick=async()=>{try{await api('/api/shutdown',{});stopped=true;pending.clear();$('shutdown').disabled=true;$('save').disabled=true;for(const [id,job]of jobs)if(job.state==='running')jobs.set(id,{state:'failed',error:t('stopped')});list();show();notice(t('stopped'));}catch(e){notice(e.message,true);}};
render();api('/api/tasks').then(r=>{tasks=r.tasks;language=r.language;render();notice(t(r.mode==='isolated-synthetic'?'synthetic':'connected'));$('fixtures').hidden=r.mode!=='isolated-synthetic';poll();metadataPoll();}).catch(e=>notice(e.message,true));
</script></body></html>
