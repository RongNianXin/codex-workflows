<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>会话查询工作台 · Windows 首版</title><style>
:root{font:15px/1.7 'Segoe UI','Microsoft YaHei',sans-serif;color:#203647;background:#edf3f7}*{box-sizing:border-box}body{margin:0}main{max-width:1280px;margin:auto;padding:28px 24px}header{border-left:5px solid #126d83;padding-left:20px;margin-bottom:24px}h1{font-size:29px;margin:4px 0}h2{font-size:19px;margin:0 0 12px}p{margin:9px 0}small,.muted{color:#536979}.layout{display:grid;grid-template-columns:minmax(320px,.9fr) minmax(0,1.25fr);gap:20px}.panel{padding:20px;border:1px solid #cad8e1;background:white;border-radius:12px;margin-bottom:16px}button,input{font:inherit}button{padding:8px 12px;border:1px solid #a9bdc8;background:white;border-radius:7px;cursor:pointer;color:#203647}button:hover:not(:disabled){background:#edf7fa}button:disabled{opacity:.45;cursor:default}.primary{background:#126d83;color:white}.primary:hover:not(:disabled){background:#09576b}button:focus-visible,input:focus-visible,summary:focus-visible{outline:3px solid #126d83;outline-offset:3px}input{width:100%;padding:9px;border:1px solid #a9bdc8;border-radius:7px;margin:5px 0 12px}label{display:block}.actions{display:flex;gap:8px;flex-wrap:wrap}.task{padding:14px 0;border-bottom:1px solid #dce5eb}.task:last-child{border:0}.name{font-weight:600}.id{font:12px/1.6 Consolas,monospace;overflow-wrap:anywhere;color:#536979;margin:4px 0 10px}.selected{border-left:3px solid #126d83;padding-left:10px}pre{white-space:pre-wrap;overflow-wrap:anywhere;font:14px/1.75 Consolas,'Microsoft YaHei',monospace;margin:0}#output{min-height:360px;max-height:75vh;overflow:auto}.status{display:inline-block;background:#edf3f7;padding:5px 10px;border-radius:5px}.error{color:#993d29}#notice{min-height:28px}.report{max-height:60vh;overflow:auto}details{margin-top:15px}summary{cursor:pointer}footer{font-size:12px;color:#536979;margin-top:20px}@media(max-width:800px){main{padding:18px 12px}.layout{grid-template-columns:1fr}#output{min-height:200px}}[hidden]{display:none!important}

#tasks{max-height:60vh;overflow-y:auto;padding-right:6px}.task-heading{display:flex;justify-content:space-between;align-items:baseline;gap:16px}.task-heading span{min-width:0;overflow-wrap:anywhere}.task-heading .name{text-align:right}.language{float:right;display:flex;gap:5px}.language [aria-pressed=true]{background:#126d83;color:white}.amber{outline:2px solid #bc851c;outline-offset:3px;background:#fff9e9}.name-note{color:#805b11;font-size:13px}#toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);max-width:90vw;width:max-content;background:#fff4d9;color:#66470c;border:1px solid #bc851c;padding:12px 20px;border-radius:8px;z-index:10}.title-line{display:flex;justify-content:space-between;gap:10px;align-items:center}#newTask{font-size:13px}#id[readonly]{background:#edf3f7}header:after{content:'';display:block;clear:both}@media(max-width:600px){.language{float:none;margin-bottom:12px}#tasks{max-height:60vh;overflow-y:auto;padding-right:6px}.task-heading{gap:10px}}
</style></head><body><main><header><nav class="language" aria-label="Language"><button data-lang="zh-CN">简体中文</button><button data-lang="en-US">English</button></nav><small data-i18n="version"></small><h1 data-i18n="title"></h1><p data-i18n="intro"></p></header>
<p id="notice" role="status" aria-live="polite"></p><div class="layout"><section><div class="panel"><div class="title-line"><h2 id="formTitle"></h2><button id="newTask" type="button" data-i18n="newTask"></button></div><form id="form" novalidate><label for="project" data-i18n="project"></label><input id="project" maxlength="80" autocomplete="off"><label for="name" data-i18n="name"></label><input id="name" maxlength="80" autocomplete="off"><p id="fieldNote" class="name-note" hidden></p><label for="id" data-i18n="id"></label><input id="id" required autocomplete="off" placeholder="xxxxxxxx-xxxx-xxxx-xxxx-xxxxxxxxxxxx"><button id="save" class="primary"></button></form><details><summary data-i18n="fixtures"></summary><p class="muted" data-i18n="fixtureHelp"></p><div class="actions"><button data-fixture="1" data-i18n="sample1"></button><button data-fixture="2" data-i18n="sample2"></button><button data-fixture="3" data-i18n="sample3"></button></div></details></div><div class="panel"><h2><span data-i18n="savedTasks"></span> <small id="count"></small></h2><label for="search" data-i18n="search"></label><input id="search" type="search"><div id="tasks" tabindex="0"></div></div></section>
<section><div class="panel" aria-live="polite"><h2 id="selected"></h2><p id="selectedId" class="id"></p><p id="nameNote" class="name-note" hidden></p><span id="status" class="status"></span><p id="time" class="muted"></p><pre id="output" tabindex="0"></pre><div class="actions"><button id="reportButton" disabled data-i18n="reportButton"></button></div><details id="reportPanel" hidden><summary data-i18n="report"></summary><pre id="report" class="report"></pre></details></div><div class="panel"><p data-i18n="closeHelp"></p><button id="shutdown" data-i18n="shutdown"></button></div></section></div><footer data-i18n="footer"></footer></main><div id="toast" role="status" hidden></div>
<script>
'use strict';
// I18N-SOURCE-SHA256: 8c443866e89a154c2de9d9cf6be7585fd17af881a2d1eecb13e8c3dc64340822
// Every key is a Chinese/English pair. Tests require both translations and verify all referenced keys.
const messages={
version:['WINDOWS 首版 · 0.2.0-dev.2 · 仅本机运行','WINDOWS · 0.2.0-dev.2 · Local only'],
title:['保存常用任务，一键查询','Save tasks. Query in one click.'],
intro:['当前仅使用隔离虚构数据。任务清单保存在本地，关闭重开仍保留；不会读取真实会话。','This build only uses isolated synthetic data. Your task list is saved locally and survives reopening. Real sessions are not read.'],
newTask:['新增任务','New task'],editTask:['编辑任务','Edit task'],project:['归属项目（可选）','Project (optional)'],name:['对话窗口名称（可选）','Conversation name (optional)'],id:['任务 ID（必填）','Task ID (required)'],save:['保存任务','Save task'],saveEdit:['保存修改','Save changes'],fixtures:['填入隔离验证 ID','Use a synthetic test ID'],fixtureHelp:['示例一、二有虚构日志；示例三用于验证未找到日志。填入后保存。','Samples 1 and 2 have synthetic logs. Sample 3 tests missing logs. Fill in a sample, then save.'],sample1:['填入示例一','Fill sample 1'],sample2:['填入示例二','Fill sample 2'],sample3:['填入无日志示例','Fill missing-log sample'],savedTasks:['常用任务','Saved tasks'],search:['搜索项目、名称或 ID','Search project, name or ID'],result:['查询结果','Query result'],reportButton:['查看详细报告','View detailed report'],report:['详细报告（仅本地）','Detailed report (local only)'],closeHelp:['关闭浏览器不会删除任务。退出本机服务后，下次双击启动入口即可继续。','Closing the browser does not delete tasks. After stopping the service, double-click the launcher to continue.'],shutdown:['退出本机服务','Stop local service'],footer:['不自动扫描、刷新或上传。结果代表本次读取的快照，不代表 AI 实时运行状态。真实数据与 macOS 支持尚未开放。','No automatic scanning, refreshing or uploading. Results describe the latest query snapshot, not live AI activity. Real data and macOS are not enabled.'],query:['查询/刷新','Query / Refresh'],querying:['正在查询…','Querying…'],edit:['编辑','Edit'],remove:['删除','Delete'],view:['查看结果','View result'],noProject:['未指定项目','No project'],noName:['名称待查询','Name not yet detected'],noMatch:['没有匹配任务。','No matching tasks.'],empty:['尚无任务。填写任务 ID 后保存即可。','No tasks yet. Enter a task ID and save.'],idle:['尚未查询','Not queried'],running:['正在调用原脚本','Running the analyzer'],done:['查询完成','Query complete'],failed:['查询失败','Query failed'],outputHelp:['先保存任务，再点该行“查询/刷新”。这里显示原脚本的查询内容。','Save a task, then click Query / Refresh on its row. The analyzer output appears here.'],reading:['正在读取隔离虚构目录，旧结果已清除…','Reading isolated synthetic data. Previous results have been cleared…'],finished:['查询完成时间：','Completed: '],saved:['任务已写入本地文件，关闭重开仍保留。','Task saved to a local file and retained after reopening.'],deleted:['已删除任务记录，报告未自动删除。','Task removed. Report files were not deleted.'],connected:['已连接本机隔离服务。','Connected to the isolated local service.'],network:['无法连接本机服务。请双击启动入口重新打开。','Cannot reach the local service. Double-click the launcher to reopen.'],invalidId:['请输入标准格式的任务 ID。','Enter a valid task ID in UUID format.'],optionalLimit:['项目和名称最多各 80 个字符，不得包含控制字符。','Project and name may each contain up to 80 characters, without control characters.'],stopped:['服务已退出。任务清单已保留，下次双击启动入口即可继续。','Service stopped. Tasks are saved. Double-click the launcher to continue.'],nameChanged:['对话窗口名称与检测结果不同，已采用检测到的名称。','The conversation name differed from the detected name and has been updated.'],previous:['原名称：','Previous name: '],nameDetected:['已填入检测到的对话窗口名称。','Detected conversation name filled in.'],metadataWarning:['查询成功，但名称未能保存。请检查本地文件权限后重新查询。','Query succeeded, but the name could not be saved. Check local file permissions and query again.'],languageUpdated:['语言已切换；查询结果按当前语言重新生成。','Language changed. Query results are regenerated in the selected language.'],languageBusy:['查询结束后可切换语言。','Language can be changed when queries finish.']
};
const $=id=>document.getElementById(id),token=location.hash.slice(1);let language='zh-CN',tasks=[],active=null,editing=null,jobs=new Map(),pending=new Set(),stopped=false,switching=false,toastTimer;
const t=key=>{if(!messages[key])throw Error('Missing translation: '+key);return messages[key][language==='en-US'?1:0];};
async function api(route,body){let response;try{response=await fetch(route,{method:body===undefined?'GET':'POST',headers:{'X-SessionDesk':token,'Accept-Language':language,...(body===undefined?{}:{'Content-Type':'application/json'})},body:body===undefined?undefined:JSON.stringify(body)});}catch{throw Error(t('network'));}const result=await response.json();if(!response.ok)throw Error(result.error||t('failed'));return result;}
function notice(text,error=false){$('notice').textContent=text;$('notice').className=error?'error':'';}
function resetForm(){editing=null;$('form').reset();$('id').readOnly=false;$('name').classList.remove('amber');$('fieldNote').hidden=true;formText();}
function formText(){$('formTitle').textContent=t(editing?'editTask':'newTask');$('save').textContent=t(editing?'saveEdit':'save');}
function previousText(task){return t('nameChanged')+' '+t('previous')+task.previousName;}
function editTask(task){editing=task.id;$('id').value=task.id;$('id').readOnly=true;$('name').value=task.name;$('project').value=task.project||'';$('fieldNote').hidden=!task.previousName;$('fieldNote').textContent=task.previousName?previousText(task):'';formText();$('name').focus();}
function list(){const q=$('search').value.trim().toLowerCase();$('count').textContent='('+tasks.length+')';$('tasks').replaceChildren();for(const task of tasks.filter(x=>[x.project,x.name,x.id].join(' ').toLowerCase().includes(q))){const row=document.createElement('div');row.className='task'+(active===task.id?' selected':'');row.dataset.id=task.id;const heading=document.createElement('div');heading.className='task-heading';const project=document.createElement('span');project.textContent=task.project||t('noProject');const name=document.createElement('span');name.className='name';name.textContent=task.name||t('noName');heading.append(project,name);const id=document.createElement('div');id.className='id';id.textContent=task.id;const actions=document.createElement('div');actions.className='actions';const query=document.createElement('button');query.className='primary';query.dataset.query=task.id;query.textContent=t(pending.has(task.id)?'querying':'query');query.disabled=pending.has(task.id)||stopped||switching;query.onclick=()=>queryTask(task.id);const edit=document.createElement('button');edit.dataset.edit=task.id;edit.textContent=t('edit');edit.disabled=stopped;edit.onclick=()=>editTask(task);const remove=document.createElement('button');remove.textContent=t('remove');remove.disabled=pending.has(task.id)||stopped;remove.onclick=async()=>{try{tasks=(await api('/api/tasks',{action:'delete',id:task.id})).tasks;jobs.delete(task.id);if(editing===task.id)resetForm();if(active===task.id){active=null;show();}list();notice(t('deleted'));}catch(e){notice(e.message,true);}};const view=document.createElement('button');view.textContent=t('view');view.disabled=!jobs.has(task.id);view.onclick=()=>{active=task.id;list();show();};actions.append(query,view,edit,remove);row.append(heading,id,actions);$('tasks').append(row);}if(!$('tasks').children.length)$('tasks').textContent=t(tasks.length?'noMatch':'empty');for(const b of document.querySelectorAll('[data-lang]')){b.disabled=!!pending.size||stopped||switching;b.title=pending.size?t('languageBusy'):'';}}
function show(){const task=tasks.find(x=>x.id===active),job=jobs.get(active);$('selected').textContent=task?(task.name||t('noName')):t('result');$('selectedId').textContent=active||'';$('nameNote').hidden=!task?.previousName&&!job?.metadataWarning;$('nameNote').textContent=job?.metadataWarning?t('metadataWarning'):task?.previousName?previousText(task):'';$('reportPanel').hidden=true;$('report').textContent='';$('reportButton').disabled=!job||job.state!=='done'||stopped;$('time').textContent=job?.finished?t('finished')+new Date(job.finished).toLocaleString(language):'';$('status').textContent=t(job?job.state:'idle');$('output').textContent=!job?t('outputHelp'):job.state==='running'?t('reading'):job.state==='done'?job.output:(job.error||t('failed'));}
function render(){document.documentElement.lang=language;document.title=t('title');for(const node of document.querySelectorAll('[data-i18n]'))node.textContent=t(node.dataset.i18n);for(const node of document.querySelectorAll('[data-lang]'))node.setAttribute('aria-pressed',String(node.dataset.lang===language));formText();if(editing){const task=tasks.find(x=>x.id===editing);if(task?.previousName)$('fieldNote').textContent=previousText(task);}list();show();}
async function completed(job){tasks=(await api('/api/tasks')).tasks;if(job.nameChange){const changed=job.nameChange.previous? t('nameChanged'):t('nameDetected');$('toast').textContent=changed;$('toast').hidden=false;clearTimeout(toastTimer);const nameField=$('name');if(editing===job.id){nameField.value=job.nameChange.current;nameField.classList.add('amber');const task=tasks.find(x=>x.id===job.id);$('fieldNote').hidden=!task?.previousName;$('fieldNote').textContent=task?.previousName?previousText(task):'';}toastTimer=setTimeout(()=>{$('toast').hidden=true;nameField.classList.remove('amber');},3000);}if(job.metadataWarning)notice(t('metadataWarning'),true);}
async function queryTask(id){if(pending.has(id)||stopped)return;pending.add(id);active=id;jobs.set(id,{state:'running'});list();show();try{const job=await api('/api/query',{id,language});jobs.set(id,job);if(job.state!=='running'){pending.delete(id);await completed(job);}}catch(e){pending.delete(id);jobs.set(id,{state:'failed',error:e.message});}finally{list();if(active===id)show();}}
async function poll(){if(stopped)return;for(const id of [...pending]){const known=jobs.get(id);if(!known?.run)continue;try{const job=await api('/api/job?id='+encodeURIComponent(id));if(jobs.get(id)?.run!==known.run)continue;jobs.set(id,job);if(job.state!=='running'){await completed(job);pending.delete(id);list();if(active===id)show();}}catch(e){pending.delete(id);jobs.set(id,{state:'failed',error:e.message});list();if(active===id)show();}}if(!stopped)setTimeout(poll,350);}
$('form').onsubmit=async e=>{e.preventDefault();const id=$('id').value.trim().toLowerCase();if(!/^[a-f0-9]{8}-[a-f0-9]{4}-[a-f0-9]{4}-[a-f0-9]{4}-[a-f0-9]{12}$/.test(id)){notice(t('invalidId'),true);return;}if([$ ('name').value,$('project').value].some(x=>x.length>80||/[\x00-\x1f]/.test(x))){notice(t('optionalLimit'),true);return;}$('save').disabled=true;try{tasks=(await api('/api/tasks',{action:editing?'edit':'add',id,name:$('name').value,project:$('project').value})).tasks;resetForm();list();if(active)show();notice(t('saved'));}catch(e){notice(e.message,true);}finally{$('save').disabled=stopped;}};
$('newTask').onclick=resetForm;$('search').oninput=list;
for(const button of document.querySelectorAll('[data-fixture]'))button.onclick=()=>{resetForm();$('id').value='00000000-0000-0000-0000-'+button.dataset.fixture.padStart(12,'0');};
for(const button of document.querySelectorAll('[data-lang]'))button.onclick=async()=>{if(button.dataset.lang===language||pending.size)return;switching=true;list();try{await api('/api/settings',{language:button.dataset.lang});language=button.dataset.lang;jobs.clear();$('toast').hidden=true;render();notice(t('languageUpdated'));if(active)await queryTask(active);}catch(e){notice(e.message,true);}finally{switching=false;list();}};
$('reportButton').onclick=async()=>{const id=active,run=jobs.get(id)?.run;try{const r=await api('/api/report?id='+encodeURIComponent(id));if(active!==id||jobs.get(id)?.run!==run)return;$('report').textContent=r.text;$('reportPanel').hidden=false;$('reportPanel').open=true;}catch(e){notice(e.message,true);}};
$('shutdown').onclick=async()=>{try{await api('/api/shutdown',{});stopped=true;pending.clear();$('shutdown').disabled=true;$('save').disabled=true;for(const [id,job]of jobs)if(job.state==='running')jobs.set(id,{state:'failed',error:t('stopped')});list();show();notice(t('stopped'));}catch(e){notice(e.message,true);}};
render();api('/api/tasks').then(r=>{tasks=r.tasks;language=r.language;render();notice(t('connected'));poll();}).catch(e=>notice(e.message,true));
</script></body></html>
