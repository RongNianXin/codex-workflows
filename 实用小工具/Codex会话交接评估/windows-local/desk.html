async function queryTask(id,preserve=false){if(pending.has(id)||stopped)return;pending.add(id);active=id;if(!preserve)cache.delete(id);jobs.set(id,{state:'running'});list();show();try{const job=await api('/api/query',{id,language,preserveHistory:preserve});jobs.set(id,job);if(job.state!=='running'){pending.delete(id);await completed(job);}}catch(e){pending.delete(id);jobs.set(id,{state:'failed',error:e.message});}finally{list();if(active===id)show();}}
async function poll(){if(stopped)return;for(const id of [...pending]){const known=jobs.get(id);if(!known?.run)continue;try{const job=await api('/api/job?id='+encodeURIComponent(id));if(jobs.get(id)?.run!==known.run)continue;jobs.set(id,job);if(job.state!=='running'){await completed(job);pending.delete(id);list();if(active===id)show();}}catch(e){pending.delete(id);jobs.set(id,{state:'failed',error:e.message});list();if(active===id)show();}}if(!stopped)setTimeout(poll,350);}
$('form').onsubmit=async e=>{e.preventDefault();const id=$('id').value.trim().toLowerCase();if(!/^[a-f0-9]{8}-[a-f0-9]{4}-[a-f0-9]{4}-[a-f0-9]{4}-[a-f0-9]{12}$/.test(id)){notice(t('invalidId'),true);return;}$('save').disabled=true;revision++;try{tasks=(await api('/api/tasks',{action:'add',id})).tasks;resetForm();list();if(active)show();notice(t('saved'));}catch(e){notice(e.message,true);}finally{$('save').disabled=stopped;}};
$('search').oninput=list;
for(const button of document.querySelectorAll('[data-fixture]'))button.onclick=()=>{resetForm();$('id').value='00000000-0000-0000-0000-'+button.dataset.fixture.padStart(12,'0');};
for(const button of document.querySelectorAll('[data-lang]'))button.onclick=async()=>{if(button.dataset.lang===language||pending.size)return;switching=true;list();try{await api('/api/settings',{language:button.dataset.lang});language=button.dataset.lang;for(const task of tasks){const old=cached(task.id);if(old)jobs.set(task.id,old);}$('toast').hidden=true;render();notice(t('languageUpdated'));if(active&&!cache.get(active)?.has(language))await queryTask(active,true);}catch(e){notice(e.message,true);}finally{switching=false;list();}};
$('reportButton').onclick=async()=>{if(!$('reportPanel').hidden){reportToggle(false);return;}const id=active,run=jobs.get(id)?.run;try{const snapshot=jobs.get(id);if(snapshot?.reportText==null)throw Error(t('failed'));const r={text:snapshot.reportText};if(active!==id||jobs.get(id)?.run!==run)return;reportRaw=r.text;reportRun=run;$('report').textContent=decorate(r.text,true);reportToggle(true);}catch(e){notice(e.message,true);}};
$('shutdown').onclick=async()=>{try{await api('/api/shutdown',{});stopped=true;pending.clear();$('shutdown').disabled=true;$('save').disabled=true;for(const [id,job]of jobs)if(job.state==='running')jobs.set(id,{state:'failed',error:t('stopped')});list();show();notice(t('stopped'));window.scrollTo({top:0,behavior:'instant'});}catch(e){notice(e.message,true);}};
render();api('/api/tasks').then(async r=>{tasks=r.tasks;language=r.language;render();$('save').disabled=true;let unavailable=false;for(const task of tasks){try{const history=await api('/api/history?id='+encodeURIComponent(task.id));unavailable ||= history.unavailable;for(const item of history.items){if(!cache.has(task.id))cache.set(task.id,new Map());cache.get(task.id).set(item.language,item);}const restored=cached(task.id);if(restored)jobs.set(task.id,restored);}catch{unavailable=true;}}active=tasks.find(x=>jobs.has(x.id))?.id||null;render();$('save').disabled=false;notice(t(unavailable?'historyUnavailable':r.mode==='isolated-synthetic'?'synthetic':'connected'));$('fixtures').hidden=r.mode!=='isolated-synthetic';poll();metadataPoll();}).catch(e=>notice(e.message,true));
</script></body></html>
